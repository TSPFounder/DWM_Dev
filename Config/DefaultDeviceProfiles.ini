; ---------------------------------------------------------------------------
; TEXTURE SIZE CAP
;
; The packaged build came out at 22 GB, essentially all cooked texture data.
; The cook is NOT over-including -- there is no DirectoriesToAlwaysCook, so
; this is genuinely what the six maps reference. The weight is that the
; marketplace environment packs (ResidentialHouses 16 GB of source, CityStreets
; 11 GB, TownShops 8.7 GB) ship 4K-8K textures and nothing here capped them.
;
; THIS FILE, not DefaultEngine.ini. TextureLODGroups are read from the DEVICE
; PROFILE; the same lines under [/Script/Engine.TextureLODSettings] in
; DefaultEngine.ini are simply ignored -- the giveaway was a re-cook that
; finished in 4 minutes instead of 25 and produced a byte-identical container.
;
; MaxLODSize caps the COOKED resolution without editing any asset: a 4096
; source texture cooks at 2048. Reversible by changing the number and
; re-cooking.
;
; World groups only. Character and UI are left at engine defaults on purpose --
; faces are looked at closely and UI must stay crisp, and neither is where the
; gigabytes are.
; ---------------------------------------------------------------------------
[Windows DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
