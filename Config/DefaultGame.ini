+MapsToCook=(FilePath="/Game/DWM/Maps/DWM_CC")
+MapsToCook=(FilePath="/Game/DWM/Maps/DWM_Mountain")
+MapsToCook=(FilePath="/Game/DWM/Maps/DWM_Hillside")
+MapsToCook=(FilePath="/Game/DWM/Maps/DWM_Valley")
+MapsToCook=(FilePath="/Game/DWM/Maps/DWM_Suburbs")
+MapsToCook=(FilePath="/Game/DWM/Maps/DWM_City")
; The world every level-to-level trip passes through. It is not a DWM map, so it was
; missing here -- in the editor it loads because everything is available, but an
; uncooked map means travel fails in a packaged build.
+MapsToCook=(FilePath="/Game/Level_Transition/Maps/Transition/Level_Transition_Updated")

; ASSETS LOADED BY PATH MUST BE LISTED HERE.
;
; The cooker only ships what something hard-references. Everything below is
; resolved from a string at runtime, so nothing references it and it silently
; does not ship. The project still runs in the editor, where every asset is
; available, which is why this only ever shows up in a packaged build -- as an
; NPC stuck in their reference pose.
; Seated and walking clips picked by name at runtime. Office_Desk_Bored_Idle
; FAILED TO LOAD in the v0.1 package for exactly this reason.
+DirectoriesToAlwaysCook=(Path="/Game/Office_Desk/Animation/Root_Motion")
; Park and bench mobility clips, also chosen by name.
+DirectoriesToAlwaysCook=(Path="/Game/Park_2/Animation")
; RP character idle set.
+DirectoriesToAlwaysCook=(Path="/Game/Scanned3DPeoplePack/RP_Character/00_Animations")
; Hank's mesh and his mocap mobility set. NOT the whole pack: /Game/YI_NPC/Demo
; carries a ThirdPersonCharacter blueprint that calls ResetOrientationAndPosition
; from the HeadMountedDisplay plugin, which is not enabled -- cooking it fails.
+DirectoriesToAlwaysCook=(Path="/Game/YI_NPC/Animation/Mocap_Mobility/IPC")
+DirectoriesToAlwaysCook=(Path="/Game/YI_NPC/Meshes/Hank/Skeletal")
; Crowd locomotion, one set per gender/build code.
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleCrowd/Character/Anims/Loco")
; Chicken animations driven by the Valley life director.
+DirectoriesToAlwaysCook=(Path="/Game/FarmAnimalsPack/Chicken/Animations")
; Customizer hair, poses and idles resolved by path. Again the named subtrees
; only: Misc_Assets/Sky/CC_SunSky needs the SunPosition plugin and will not
; compile without it.
+DirectoriesToAlwaysCook=(Path="/Game/CharacterCustomizer/Characters/ApparelPack_Example_Character")
+DirectoriesToAlwaysCook=(Path="/Game/CharacterCustomizer/Characters/CCMH/Hair")
+DirectoriesToAlwaysCook=(Path="/Game/CharacterCustomizer/Components/SLS")

; NON-ASSET FILES MUST BE STAGED EXPLICITLY.
;
; world_economy.db is a plain SQLite file, not a .uasset, so cooking ignores it and
; the whole Content/Databases folder was simply absent from the package -- SQLite
; then reported "disk I/O error" on Maria's trade, because neither the file nor its
; parent directory existed. NonUFS keeps it as a loose file on disk rather than
; sealing it inside the pak, which SQLite cannot open.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Databases")

